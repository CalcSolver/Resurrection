<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UV + Bare-Mux Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d0f13;
      color: #e8eaef;
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1.25rem;
    }
    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #2b3140;
      background: #151820;
      color: #e8eaef;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid #d4af37;
      background: #151820;
      color: #d4af37;
      font-weight: 600;
      cursor: pointer;
    }
    #log {
      white-space: pre-wrap;
      background: #151820;
      border: 1px solid #252a36;
      border-radius: 6px;
      padding: 1rem;
      font-size: 0.85rem;
      line-height: 1.5;
      min-height: 140px;
    }
  </style>
</head>
<body>
  <h2>Ultraviolet + Bare-Mux Isolation Test</h2>
  <form id="testForm">
    <input id="urlInput" type="text" value="https://example.com" required />
    <button type="submit">Go</button>
  </form>
  <div id="log">Waiting for submit...</div>

  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv.config.js"></script>

  <script>
    const WISP_URL = "wss://wisp.mercurywork.shop/";
    const SW_SCOPE = "/24/54/";
    const logEl = document.getElementById("log");

    function log(msg) {
      console.log("[TEST]", msg);
      logEl.textContent += `\n${msg}`;
    }

    document.getElementById("testForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      logEl.textContent = "Starting test...";

      let target = document.getElementById("urlInput").value.trim();
      if (!/^https?:\/\//i.test(target)) target = "https://" + target;

      try {
        log("1. Checking globals...");
        log(`BareMux: ${!!window.BareMux}, __uv$config: ${!!window.__uv$config}`);
        log(`prefix: ${window.__uv$config?.prefix}, encodeUrl: ${typeof window.__uv$config?.encodeUrl}`);

        log("2. Registering /sw.js...");
        const reg = await navigator.serviceWorker.register("/sw.js", { scope: SW_SCOPE });
        log(`Registered. Scope: ${reg.scope}`);
        await navigator.serviceWorker.ready;
        log("ServiceWorker ready.");

        log("3. Configuring BareMux + Epoxy...");
        const conn = new BareMux.BareMuxConnection("/baremux/worker.js");
        await conn.setTransport("/epoxy/index.mjs", [{ wisp: WISP_URL }]);
        log(`Transport set to /epoxy/index.mjs with ${WISP_URL}`);

        log("4. Encoding URL and navigating...");
        const encoded = window.__uv$config.encodeUrl(target);
        const finalUrl = window.__uv$config.prefix + encoded;
        log(`Navigating to: ${finalUrl}`);

        window.location.href = finalUrl;
      } catch (err) {
        log(`ERROR: ${err.name}: ${err.message}`);
        console.error(err);
      }
    });
  </script>
</body>
</html>
